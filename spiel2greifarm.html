<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greifarm-Spiel: Proportionalität & Dreisatz</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2330;--mut:#5d6575;--acc:#e0603a;--acc2:#2f7d6d;--bad:#b3322e;--line:#ddd6c8;--cv:#fff7e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--ink:#eceff4;--mut:#9aa3b2;--acc:#ff7f57;--acc2:#4fb8a3;--bad:#ff7a73;--line:#333b48;--cv:#262c38}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--ink:#eceff4;--mut:#9aa3b2;--acc:#ff7f57;--acc2:#4fb8a3;--bad:#ff7a73;--line:#333b48;--cv:#262c38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.4rem}.stat span{font-size:.75rem;color:var(--mut)}
.q{font-size:1.1rem;margin:0 0 12px}
input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{min-height:1.4em;margin:10px 0 0;font-weight:600}
.ok{color:var(--acc2)}.no{color:var(--bad)}
.sol{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;font-size:.95rem;white-space:pre-line}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:var(--cv);touch-action:manipulation}
.hint{color:var(--mut);font-size:.85rem;margin:8px 0 0}
#tbl{overflow-x:auto;margin:0 0 12px}#tbl table{border-collapse:collapse;width:100%}#tbl th,#tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center}#tbl th{background:var(--bg);text-align:left;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Rechne dir den Greifarm frei</h1>
<p class="sub">Löse die Aufgabe. Jede richtige Antwort gibt dir einen Greifversuch.</p>

<div class="stats">
<div class="stat"><b id="sC">0</b><span>Gewonnen</span></div>
<div class="stat"><b id="sT">0</b><span>Versuche frei</span></div>
<div class="stat"><b id="sR">0</b><span>Richtig</span></div>
</div>

<div class="card">
<div class="row seg" role="group" aria-label="Antwortart">
<button id="mMC" class="on">Multiple Choice</button>
<button id="mIn">Eingabe</button>
</div>
</div>

<div class="card">
<p class="q" id="qText"></p>
<div id="tbl" hidden></div>
<div id="mcBox" class="opts"></div>
<div id="inBox" hidden>
<input id="ans" type="text" inputmode="decimal" placeholder="Deine Antwort (z. B. 7,5)" autocomplete="off">
<div class="row" style="margin-top:8px"><button class="pri" id="chk">Prüfen</button></div>
</div>
<div class="row" style="margin-top:8px"><button id="hintB">Tipp</button><button id="nextB" hidden>Nächste Aufgabe</button></div>
<p class="msg" id="msg" role="status"></p>
<div class="sol" id="sol" hidden></div>
</div>

<div class="card">
<canvas id="cv" width="320" height="210" aria-label="Greifarm-Automat"></canvas>
<div class="row" style="margin-top:10px"><button class="pri" id="grab" disabled style="flex:1">Greifen!</button></div>
<p class="hint" id="gMsg">Löse zuerst eine Aufgabe, um zu spielen.</p>
<p class="hint">Nach 3 falschen Versuchen zeige ich den Lösungsweg, dann gibt es keinen Greifversuch.</p>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const f=n=>String(Math.round(n*100)/100).replace('.',',');
const st={mode:'mc',turns:0,coll:0,right:0,q:null,att:0,done:false};

function makeQ(){
  const t=R(0,8);let q;
  if(t===0){
    const k=P([1.5,2,2.5,3,4,5]),n=R(2,8);let m=R(3,12);if(m===n)m++;
    const it=P(['kg Äpfel','kg Trauben','Liter Saft']);
    q={text:`${n} ${it} kosten ${f(n*k)} €. Wie viel kosten ${m} ${it.split(' ')[0]}${it.slice(it.indexOf(' '))}? (Antwort in €)`,ans:m*k,
    hint:'Rechne zuerst den Preis für 1 aus (Dreisatz).',
    sol:`Preis für 1: ${f(n*k)} € : ${n} = ${f(k)} €\nPreis für ${m}: ${f(k)} € · ${m} = ${f(m*k)} €`};
  }else if(t===1){
    const a=R(2,8),k=P([2,3,4,5,1.5,2.5,6]);
    q={text:`In einer proportionalen Zuordnung gehört zu x = ${a} der Wert y = ${f(a*k)}. Wie groß ist der Proportionalitätsfaktor k?`,ans:k,
    hint:'Es gilt k = y : x.',sol:`k = y : x = ${f(a*k)} : ${a} = ${f(k)}`};
  }else if(t===2){
    const v=P([40,45,60,75,80,90]),h=R(2,4);let h2=R(3,7);if(h2===h)h2++;
    q={text:`Ein Auto fährt in ${h} Stunden ${f(v*h)} km. Wie weit fährt es bei gleicher Geschwindigkeit in ${h2} Stunden? (Antwort in km)`,ans:v*h2,
    hint:'Wie weit fährt das Auto in 1 Stunde?',sol:`In 1 h: ${f(v*h)} km : ${h} = ${f(v)} km\nIn ${h2} h: ${f(v)} km · ${h2} = ${f(v*h2)} km`};
  }else if(t===3){
    const g=P([50,75,100,125,150,200]),n=P([2,4,6]),m=P([3,5,8,10,12]);
    q={text:`Für ${n} Personen braucht man ${f(n*g)} g Nudeln. Wie viel Gramm braucht man für ${m} Personen?`,ans:m*g,
    hint:'Bestimme zuerst die Menge für 1 Person.',sol:`Für 1 Person: ${f(n*g)} g : ${n} = ${f(g)} g\nFür ${m} Personen: ${f(g)} g · ${m} = ${f(m*g)} g`};
  }else if(t>=5){
    const k=P([2,3,4,5,1.5,2.5,0.5]),xs=P([[1,2,3,4],[2,4,6,8],[3,5,6,10],[2,5,8,10]]),ys=xs.map(x=>Math.round(x*k*100)/100);
    const l=P([['Menge (kg)','Preis (€)'],['Zeit (h)','Strecke (km)'],['Anzahl Hefte','Kosten (€)'],['x','y']]);
    if(t===5){
      const i=R(0,3),j=(i+1)%4,sh=ys.slice();sh[i]='?';
      q={text:'Die Zuordnung in der Tabelle ist proportional. Welcher Wert fehlt?',ans:ys[i],tbl:{l,x:xs,y:sh},
      hint:'Bestimme zuerst den Faktor k = y : x aus einer vollständigen Spalte.',
      sol:`k = ${f(ys[j])} : ${xs[j]} = ${f(k)}\nFehlender Wert: ${f(k)} · ${xs[i]} = ${f(ys[i])}`};
    }else if(t===6){
      const prop=Math.random()<.5,sh=ys.slice();
      if(!prop){const i=R(1,3);sh[i]=ys[i]+P([-1,1,2])}
      const qs=sh.map((y,i)=>f(y/xs[i])).join(' ; ');
      q={text:'Ist die Zuordnung in der Tabelle proportional?',yn:true,ans:prop?'Ja':'Nein',tbl:{l,x:xs,y:sh},
      hint:'Berechne in jeder Spalte den Quotienten y : x. Sind alle gleich?',
      sol:prop?`Alle Quotienten y : x sind gleich: ${qs}\nAlso ist die Zuordnung proportional.`:`Die Quotienten y : x sind nicht alle gleich: ${qs}\nAlso ist die Zuordnung nicht proportional.`};
    }else if(t===7){
      q={text:'Die Zuordnung in der Tabelle ist proportional. Bestimme den Proportionalitätsfaktor k.',ans:k,tbl:{l,x:xs,y:ys},
      hint:'Es gilt k = y : x.',sol:`k = y : x = ${f(ys[0])} : ${xs[0]} = ${f(k)}`};
    }else{
      const n=R(2,6),m=R(7,12);
      q={text:'Die Zuordnung ist proportional. Ergänze den fehlenden Wert mit dem Dreisatz.',ans:Math.round(m*k*100)/100,tbl:{l,x:[n,m],y:[Math.round(n*k*100)/100,'?']},
      hint:'Rechne zuerst auf 1 herunter, dann auf den gesuchten Wert hoch.',
      sol:`Für 1: ${f(n*k)} : ${n} = ${f(k)}\nFür ${m}: ${f(k)} · ${m} = ${f(m*k)}`};
    }
  }else{
    const k=P([2,3,4,5,7,1.5]),a=R(3,9);
    q={text:`Eine proportionale Zuordnung hat die Gleichung y = ${f(k)} · x. Wie groß ist y für x = ${a}?`,ans:k*a,
    hint:'Setze x in die Gleichung ein.',sol:`y = ${f(k)} · ${a} = ${f(k*a)}`};
  }
  if(!q.yn)q.ans=Math.round(q.ans*100)/100;return q;
}
function drawTbl(){const t=st.q.tbl,e=$('tbl');if(!t){e.hidden=true;return}
  e.hidden=false;const c=a=>a.map(v=>`<td>${typeof v==='number'?f(v):v}</td>`).join('');
  e.innerHTML=`<table><tr><th>${t.l[0]}</th>${c(t.x)}</tr><tr><th>${t.l[1]}</th>${c(t.y)}</tr></table>`}
function distract(c){
  const s=new Set([c]);const base=[c+1,c-1,c*2,c/2,c+2,c-2,c+5,c*1.5,c+10];
  const out=[c];
  for(const d of base.sort(()=>Math.random()-.5)){const v=Math.round(d*100)/100;if(v>0&&!s.has(v)){s.add(v);out.push(v)}if(out.length===4)break}
  return out.sort(()=>Math.random()-.5);
}
function load(){
  st.q=makeQ();st.att=0;st.done=false;
  $('qText').textContent=st.q.text;drawTbl();$('msg').textContent='';$('msg').className='msg';
  $('sol').hidden=true;$('nextB').hidden=true;$('hintB').disabled=false;$('ans').value='';$('chk').disabled=false;
  const box=$('mcBox');box.innerHTML='';
  (st.q.yn?['Ja','Nein']:distract(st.q.ans)).forEach(v=>{const b=document.createElement('button');b.textContent=st.q.yn?v:f(v);b.onclick=()=>submit(v,b);box.appendChild(b)});
  setMode(st.mode);
}
function setMode(m){
  st.mode=m;$('mMC').classList.toggle('on',m==='mc');$('mIn').classList.toggle('on',m==='in');
  const y=st.q&&st.q.yn;$('mcBox').hidden=!y&&m!=='mc';$('inBox').hidden=y||m!=='in';
}
function submit(v,btn){
  if(st.done)return;
  if(!st.q.yn&&isNaN(v)){$('msg').textContent='Bitte gib eine Zahl ein.';$('msg').className='msg no';return}
  if(st.q.yn?v===st.q.ans:Math.abs(v-st.q.ans)<1e-6){
    st.done=true;st.turns++;st.right++;
    $('msg').textContent='Richtig! Du hast einen Greifversuch verdient.';$('msg').className='msg ok';
    $('nextB').hidden=false;$('hintB').disabled=true;$('chk').disabled=true;
    document.querySelectorAll('#mcBox button').forEach(b=>b.disabled=true);
    upd();
  }else{
    st.att++;if(btn)btn.disabled=true;
    if(st.att>=3){
      st.done=true;$('msg').textContent='Hier ist der Lösungsweg. Diesmal gibt es keinen Greifversuch.';$('msg').className='msg no';
      $('sol').textContent=st.q.sol+'\nErgebnis: '+(st.q.yn?st.q.ans:f(st.q.ans));$('sol').hidden=false;$('nextB').hidden=false;$('chk').disabled=true;
      document.querySelectorAll('#mcBox button').forEach(b=>b.disabled=true);
    }else{$('msg').textContent=`Leider falsch. Versuch ${st.att} von 3.`;$('msg').className='msg no'}
  }
}
function upd(){
  $('sC').textContent=st.coll;$('sT').textContent=st.turns;$('sR').textContent=st.right;
  $('grab').disabled=st.turns<1||claw.s!=='idle';
  if(st.turns>0&&claw.s==='idle')$('gMsg').textContent='Drücke „Greifen!“, wenn der Arm über einem Preis ist.';
}
$('chk').onclick=()=>submit(parseFloat($('ans').value.trim().replace(',','.')));
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')$('chk').click()});
$('hintB').onclick=()=>{$('msg').textContent='Tipp: '+st.q.hint;$('msg').className='msg'};
$('nextB').onclick=load;
$('mMC').onclick=()=>setMode('mc');$('mIn').onclick=()=>setMode('in');

/* Greifarm */
const cv=$('cv'),cx=cv.getContext('2d'),W=320,H=210;
const claw={x:160,y:30,dir:1,s:'idle',got:null};
let prizes=[];
function spawn(){prizes=[];const em=['🧸','🎁','🐙','🍭','🚀','⭐'];for(let i=0;i<6;i++)prizes.push({x:30+i*52+R(-6,6),e:P(em),t:false})}
spawn();
function startGrab(){
  if(st.turns<1||claw.s!=='idle')return;
  st.turns--;claw.s='down';$('gMsg').textContent='';upd();
}
$('grab').onclick=startGrab;
addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();startGrab()}});
function loop(){
  const cs=getComputedStyle(document.documentElement);
  if(claw.s==='idle'){claw.x+=1.7*claw.dir;if(claw.x>300||claw.x<20)claw.dir*=-1}
  else if(claw.s==='down'){claw.y+=3;if(claw.y>=150){
    let best=null;prizes.forEach(p=>{if(!p.t&&Math.abs(p.x-claw.x)<20&&(!best||Math.abs(p.x-claw.x)<Math.abs(best.x-claw.x)))best=p});
    claw.got=best;claw.s='up'}}
  else if(claw.s==='up'){claw.y-=3;if(claw.got)claw.got.x=claw.x;
    if(claw.y<=30){claw.y=30;claw.s='idle';
      if(claw.got){claw.got.t=true;st.coll++;$('gMsg').textContent='Treffer! Du hast etwas gewonnen.';claw.got=null;if(prizes.every(p=>p.t))spawn()}
      else $('gMsg').textContent='Daneben. Löse die nächste Aufgabe für einen neuen Versuch.';
      upd()}}
  cx.clearRect(0,0,W,H);
  cx.fillStyle=cs.getPropertyValue('--line');cx.fillRect(0,0,W,6);
  cx.font='28px serif';cx.textAlign='center';
  prizes.forEach(p=>{if(!p.t||p===claw.got)cx.fillText(p.e,p.x,p===claw.got?claw.y+34:190)});
  cx.strokeStyle=cs.getPropertyValue('--ink');cx.lineWidth=3;
  cx.beginPath();cx.moveTo(claw.x,6);cx.lineTo(claw.x,claw.y);cx.stroke();
  const o=claw.s==='idle'||claw.s==='down'?12:5;
  cx.beginPath();cx.moveTo(claw.x-o,claw.y+14);cx.lineTo(claw.x,claw.y);cx.lineTo(claw.x+o,claw.y+14);cx.stroke();
  requestAnimationFrame(loop);
}
load();upd();loop();
</script>
</body>
</html>
